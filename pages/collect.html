<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>收藏</title>
  </head>
  <body>
    <%- include('./layout/header'); %>
    <main>
      <div class="py-64 py-24-xs">
        <div class="container-xxs">
          <div class="mb-32">
            <h2 class="heading-h3 heading-h4-xs text-center">
              <i class="bi bi-check check-title"></i>我的收藏
            </h2>
          </div>
          <div class="business-time text-primary-400">
            <i class="bi bi-truck truck-icon business-icon-xs"></i>
            <p class="label-md">
              <span class="business-time-title d-block-xs">門市營業時間：</span><span class="business-time-detail d-block-xs">週一至週五 10:00 - 22:00</span>
            </p>
          </div>
          <div class="py-32 py-24-xs collect-card">
            <div class="d-flex">
              <div class="collect-item">
                <img src="/assets/images/image.png" alt="" />
              </div>
              <div class="collect-content">
                <p class="heading-h5 heading-h6-xs mb-8-xs">PLATFORM 404</p>
                <p class="mb-8-xs">
                  <span class="paragraph-md text-neutral-600 pr-12">尺寸</span
                  ><span class="label-md">38</span>
                </p>
                <p class="mb-8-xs">
                  <span class="paragraph-md text-neutral-600 pr-12">顏色</span
                  ><span class="label-md">Navy</span>
                </p>
                <p class="heading-h6 text-end text-start-xs">NT$2,600</p>
              </div>
            </div>
          </div>
          <div class="py-32 py-24-xs collect-card">
            <div class="d-flex">
              <div class="collect-item">
                <img src="/assets/images/product-4.png" alt="" />
              </div>
              <div class="collect-content">
                <p class="heading-h5 heading-h6-xs mb-8-xs">BOOMLOK</p>
                <p class="mb-8-xs">
                  <span class="paragraph-md text-neutral-600 pr-12">尺寸</span
                  ><span class="label-md">38</span>
                </p>
                <p class="mb-8-xs">
                  <span class="paragraph-md text-neutral-600 pr-12">顏色</span
                  ><span class="label-md">White</span>
                </p>
                <p class="heading-h6 text-end text-start-xs">NT$3,200</p>
              </div>
            </div>
          </div>
          <div class="py-32 py-24-xs collect-card mb-32">
            <div class="d-flex">
              <div class="collect-item">
                <img src="/assets/images/product-3.png" alt="" />
              </div>
              <div class="collect-content">
                <p class="heading-h5 heading-h6-xs mb-8-xs">MELTY KISS</p>
                <p class="mb-8-xs">
                  <span class="paragraph-md text-neutral-600 pr-12">尺寸</span
                  ><span class="label-md">38</span>
                </p>
                <p class="mb-8-xs">
                  <span class="paragraph-md text-neutral-600 pr-12">顏色</span
                  ><span class="label-md">Violet</span>
                </p>
                <p class="heading-h6 text-end text-start-xs">NT$4,000</p>
              </div>
            </div>
          </div>
          <div class="d-flex justify-center align-center">
            <button type="button" class="btn btn-black">
              立即預約門市試穿
            </button>
          </div>
        </div>
      </div>
    </main>
    <%- include('./layout/footer'); %>
    <script type="module" src="../main.js"></script>
  </body>
</html>
